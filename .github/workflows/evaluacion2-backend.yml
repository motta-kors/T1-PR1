name: Evaluacion 2 - Backend
on:
  push:
    branches: [evaluacion-2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary local secret
        working-directory: evaluacion2
        run: |
          echo "INTERNAL_SERVICE_KEY=$(openssl rand -hex 32)" > .env
      - name: Build and start services
        working-directory: evaluacion2
        run: docker compose up --build -d --wait
      - name: Provision testing administrator
        working-directory: evaluacion2
        env:
          ADMIN_EMAIL: admin@example.test
          ADMIN_PASSWORD: CI-Demo-Only-Password-2026!
        run: docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD auth python -m services.provision_admin
      - name: Install testing dependencies
        run: python -m pip install -r evaluacion2/tests/requirements.txt
      - name: Execute functional and security tests
        env:
          ADMIN_EMAIL: admin@example.test
          ADMIN_PASSWORD: CI-Demo-Only-Password-2026!
        run: python -m pytest evaluacion2/tests -v
      - name: Measure REST load
        run: python evaluacion2/tests/load_test.py --requests 100 --concurrency 5
      - name: Containers and service logs
        if: always()
        working-directory: evaluacion2
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100
          docker compose down
